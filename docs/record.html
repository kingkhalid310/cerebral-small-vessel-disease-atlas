<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A structured evidence record from the cSVD Evidence Guide."><title>Evidence record · cSVD Evidence Guide</title><link rel="stylesheet" href="assets/styles.css"></head><body><div id="site-header"></div><main id="main"><div id="record"><section class="page-hero"><div class="container"><p class="eyebrow">Loading evidence</p><h1>Please wait…</h1></div></section></div></main><div id="site-footer"></div><script src="assets/app.js"></script><script>
Guide.shell('explore');const id=new URLSearchParams(location.search).get('id');Guide.catalog().then(data=>{const byId=new Map(data.records.map(r=>[r.id,r]));const r=byId.get(id);if(!r){document.getElementById('record').innerHTML='<section class="section"><div class="narrow empty">Record not found. <a href="explore.html">Return to the evidence library.</a></div></section>';return}document.title=`${r.id} · ${r.title} · cSVD Evidence Guide`;document.getElementById('record').innerHTML=`<section class="page-hero"><div class="container"><p class="eyebrow">${Guide.esc(Guide.human(r.type))} · ${Guide.esc(r.id)}</p><h1>${Guide.esc(r.title)}</h1><p>${Guide.esc(r.summary)}</p><div>${Guide.badge(r.state)}${Guide.badge(r.domain)}${Guide.badge(r.priority)}</div></div></section><section class="section"><div class="container record-layout"><div>${Guide.groupedFields(r,byId)}</div><aside class="record-aside"><div class="card"><span class="number">READING RULE</span><h3>Keep the context attached</h3><p>Interpret this record within its population, reference standard, limitations, extraction depth, and evidence state.</p></div><div class="card"><span class="number">NEXT MOVE</span><h3>Follow the connections</h3><p>Linked IDs open the studies, claims, tools, and questions that surround this record.</p></div><a class="button small" href="explore.html?type=${encodeURIComponent(r.type)}">More ${Guide.esc(Guide.human(r.type))} records</a></aside></div></section>`}).catch(error=>document.getElementById('record').innerHTML=`<section class="section"><div class="narrow empty">${Guide.esc(error.message)}</div></section>`);
</script></body></html>

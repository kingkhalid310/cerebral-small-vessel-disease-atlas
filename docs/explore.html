<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Search and filter the cSVD Evidence Guide."><title>Explore · cSVD Evidence Guide</title><link rel="stylesheet" href="assets/styles.css"></head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero"><div class="container"><p class="eyebrow">Evidence explorer</p><h1>Search the field as a connected system.</h1><p>Filter questions, claims, studies, criteria, biomarkers, cohorts, hypotheses, cases, and sources. Open any record to inspect its complete structured evidence.</p></div></section>
    <section class="section"><div class="container">
      <div class="toolbar" role="search">
        <label>Search<input id="search" type="search" placeholder="Try ‘arteriolosclerosis’, ‘Boston’, ‘CVR’…"></label>
        <label>Record type<select id="type"><option value="">All types</option></select></label>
        <label>Status<select id="status"><option value="">All statuses</option></select></label>
        <label>Domain<select id="domain"><option value="">All domains</option></select></label>
      </div>
      <div class="results-meta"><span id="result-count" aria-live="polite">Loading records…</span><button class="button" id="reset" type="button">Clear filters</button></div>
      <div id="results" class="record-grid"></div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/app.js"></script>
  <script>
    Guide.shell('explore');
    const controls = ['search','type','status','domain'].reduce((o,id)=>(o[id]=document.getElementById(id),o),{});
    let records = [];
    const option = (value,label=value) => `<option value="${Guide.esc(value)}">${Guide.esc(label)}</option>`;
    const unique = (source,key) => [...new Set(source.map(r=>r[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    function updateFacets() {
      const source = controls.type.value ? records.filter(r=>r.type===controls.type.value) : records;
      const previousStatus = controls.status.value; const previousDomain = controls.domain.value;
      controls.status.innerHTML = '<option value="">All evidence states</option>' + unique(source,'state').map(v=>option(v,Guide.human(v))).join('');
      controls.domain.innerHTML = '<option value="">All domains</option>' + unique(source,'domain').map(v=>option(v)).join('');
      if ([...controls.status.options].some(o=>o.value===previousStatus)) controls.status.value=previousStatus;
      if ([...controls.domain.options].some(o=>o.value===previousDomain)) controls.domain.value=previousDomain;
    }
    function render() {
      const q = controls.search.value.trim().toLowerCase();
      const filtered = records.filter(r => (!q || r.search_text.includes(q)) && (!controls.type.value || r.type===controls.type.value) && (!controls.status.value || r.state===controls.status.value) && (!controls.domain.value || r.domain===controls.domain.value));
      document.getElementById('result-count').textContent = `${filtered.length} of ${records.length} records`;
      document.getElementById('results').innerHTML = filtered.length ? filtered.map(r=>`<a class="card record-card" href="record.html?id=${encodeURIComponent(r.id)}"><div>${Guide.badge(Guide.human(r.type))}${Guide.badge(r.state)}<h3>${Guide.esc(r.id)} · ${Guide.esc(r.title)}</h3><p>${Guide.esc(r.summary || 'Open the complete structured record.')}</p></div><div class="meta">${Guide.badge(r.domain)}${Guide.badge(r.priority)}</div></a>`).join('') : '<div class="empty">No records match these filters. Try a broader term or clear the filters.</div>';
      const params = new URLSearchParams(); Object.entries(controls).forEach(([key,el])=>{if(el.value) params.set(key,el.value)}); history.replaceState(null,'',`${location.pathname}${params.toString()?'?'+params:''}`);
    }
    Guide.catalog().then(data => {
      records = data.records;
      controls.type.innerHTML += Object.keys(data.counts).filter(k=>data.counts[k]).map(k=>option(k,`${Guide.human(k)} (${data.counts[k]})`)).join('');
      const params = new URLSearchParams(location.search); if(params.has('type')) controls.type.value=params.get('type'); updateFacets();
      ['search','status','domain'].forEach(key=>{if(params.has(key)) controls[key].value=params.get(key)});
      controls.type.addEventListener('input',()=>{controls.status.value='';controls.domain.value='';updateFacets();render()});
      ['search','status','domain'].forEach(key=>controls[key].addEventListener('input',render));
      document.getElementById('reset').addEventListener('click',()=>{Object.values(controls).forEach(el=>el.value='');updateFacets();render();controls.search.focus()});
      render();
    }).catch(error => document.getElementById('results').innerHTML=`<div class="empty">${Guide.esc(error.message)} Preview this site through a local web server rather than opening the file directly.</div>`);
  </script>
</body>
</html>

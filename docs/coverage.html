<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Transparent topic-by-topic depth and gap map for the cSVD Evidence Guide."><title>Coverage map · cSVD Evidence Guide</title><link rel="stylesheet" href="assets/styles.css"></head><body><div id="site-header"></div><main id="main"><section class="page-hero"><div class="container"><p class="eyebrow">Coverage before confidence</p><h1>See what is deep, what is introductory, and what is still missing.</h1><p>The guide does not hide unfinished domains. Every topic has a depth state, current module, linked sources, explicit gap, and next editorial action.</p></div></section><section class="section"><div class="container"><div class="coverage-summary" id="coverage-summary" aria-live="polite"></div><div class="toolbar coverage-toolbar"><label>Search<input id="coverage-search" type="search" placeholder="CAA, venous disease, cognition..."></label><label>Domain<select id="coverage-domain"><option value="">All domains</option></select></label><label>Depth<select id="coverage-depth"><option value="">All depth states</option></select></label></div><div id="coverage-grid" class="coverage-grid"></div></div></section></main><div id="site-footer"></div><script src="assets/app.js"></script><script>
Guide.shell('coverage');
(async()=>{const data=await Guide.catalog();const topics=data.records.filter(r=>r.type==='topic');const byId=new Map(topics.map(r=>[r.id,r]));const get=(r,k)=>r.fields.find(f=>f.key===k)?.value||'';const domain=document.querySelector('#coverage-domain');const depth=document.querySelector('#coverage-depth');[...new Set(topics.map(r=>get(r,'domain')))].sort().forEach(v=>domain.add(new Option(v,v)));[...new Set(topics.map(r=>get(r,'depth_status')))].sort().forEach(v=>depth.add(new Option(v,v)));const render=()=>{const q=document.querySelector('#coverage-search').value.toLowerCase();const rows=topics.filter(r=>(!q||r.search_text.includes(q))&&(!domain.value||get(r,'domain')===domain.value)&&(!depth.value||get(r,'depth_status')===depth.value));const counts=topics.reduce((a,r)=>(a[get(r,'depth_status')]=(a[get(r,'depth_status')]||0)+1,a),{});document.querySelector('#coverage-summary').innerHTML=`<div class="stat"><strong>${topics.length}</strong><span>mapped topics</span></div>${Object.entries(counts).sort().map(([k,v])=>`<div class="stat"><strong>${v}</strong><span>${Guide.esc(k)}</span></div>`).join('')}`;document.querySelector('#coverage-grid').innerHTML=rows.map(r=>`<article class="coverage-card"><div><span class="badge ${get(r,'depth_status')==='mapped'?'gap':get(r,'depth_status')==='core'?'emerging':'bounded'}">${Guide.esc(get(r,'depth_status'))}</span><span class="coverage-domain">${Guide.esc(get(r,'domain'))}</span></div><h2>${Guide.esc(r.title)}</h2><p><strong>Current home:</strong> ${Guide.esc(get(r,'current_module'))}</p><p><strong>Known gap:</strong> ${Guide.esc(get(r,'gap'))}</p><p><strong>Next action:</strong> ${Guide.esc(get(r,'next_action'))}</p><a href="record.html?id=${encodeURIComponent(r.id)}">Open full coverage record →</a></article>`).join('')||'<p class="empty">No topics match these filters.</p>'};document.querySelector('#coverage-search').addEventListener('input',render);domain.addEventListener('change',render);depth.addEventListener('change',render);render();})().catch(e=>document.querySelector('#coverage-grid').innerHTML=`<p class="empty">${Guide.esc(e.message)}</p>`);
</script></body></html>

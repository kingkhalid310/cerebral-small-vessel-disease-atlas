name: Validate evidence atlas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild site catalog
        run: python3 scripts/build_site_data.py
      - name: Confirm generated catalog is committed
        run: git diff --exit-code -- docs/data/catalog.json
      - name: Validate evidence relationships and public boundary
        run: python3 scripts/validate.py
